name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the job that needs to publish annotations gets more.
permissions:
  contents: read

jobs:
  # Fast platform-independent checks. Gating everything else on this avoids
  # spinning up test runners when fmt/lint/audit would fail anyway.
  check:
    runs-on: ubuntu-latest
    # audit-check reports findings by creating a check run; without checks:write
    # it fails with "Resource not accessible by integration" the moment an
    # advisory appears — fatal on push to main, silent on pull_request.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # audit-check otherwise installs cargo-audit from source without its
      # lockfile, allowing transitive dependency updates to break the pinned
      # Rust toolchain before the audit can run. Preinstall a pinned binary so
      # the action can go straight to the audit.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2

      # Pinned past v2.0.0: that release still declares node20, which runners
      # now force onto node24 with a deprecation warning. Upstream fixed it in
      # 858dc40 but has not cut a release. Only three commits separate them —
      # two README edits and the runtime bump.
      #
      # Dependabot tracks SHA pins by their latest *tag*, so it may propose
      # moving this back to v2.0.0. That would reintroduce the warning; take
      # the bump only once a release newer than v2.0.0 exists.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, post-v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: cargo fmt --check
      # --all-targets so test code is linted too; mirrors `just check`.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # A release PR must carry its release notes. Nothing else enforces this:
  # cargo-release writes CHANGELOG.md from commit subjects, but the prose in
  # WHATSNEW.md is hand-written and easy to forget — and once the release is
  # dispatched the tag is immutable, so "fix it in the next one" is the only
  # remedy. A no-op on every PR that does not change the version.
  whatsnew:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: require release notes when the version changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          read_version() { sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' | head -1; }
          old=$(git show "$BASE_SHA:Cargo.toml" | read_version)
          new=$(read_version < Cargo.toml)
          if [ -z "$new" ]; then
            echo "::error::could not read the version from Cargo.toml; this check did not run"
            exit 1
          fi
          if [ "$old" = "$new" ]; then
            echo "version unchanged ($new) — release notes not required"
            exit 0
          fi
          if ! grep -q "^## \[$new\]" WHATSNEW.md; then
            echo "::error::Cargo.toml moves $old -> $new but WHATSNEW.md has no '## [$new]' section. Add the release notes before merging."
            exit 1
          fi
          echo "release notes present for $new"

      # Every PR declares its user-facing impact while the author still has the
      # context. Squash is the only merge method here and the squash body is the
      # PR description verbatim, so this block lands in main's commit body and
      # `just whatsnew-draft` can collect it at release time without network.
      #
      # Dependabot cannot be taught to write one, so it is exempt; its bumps are
      # not user-facing anyway.
      - name: require a whatsnew block in the PR description
        if: github.actor != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          body=$(printf '%s' "$BODY" | tr -d '\r')

          if ! printf '%s\n' "$body" | grep -q '^```whatsnew[[:space:]]*$'; then
            echo "Add a whatsnew block to the PR description:"
            echo ''
            echo '    ```whatsnew'
            echo '    - `wsp foo` no longer does the wrong thing.'
            echo '    ```'
            echo ''
            echo "Use NONE if a user cannot observe this change by running wsp"
            echo "(refactors, tests, CI, docs). Style: RELEASING.md."
            echo "::error::PR description has no \`\`\`whatsnew block"
            exit 1
          fi

          block=$(printf '%s\n' "$body" | awk '
            /^```whatsnew[[:space:]]*$/ { inblock = 1; next }
            inblock && /^```/           { exit }
            inblock                     { print }
          ')

          compact=$(printf '%s' "$block" | tr -d '[:space:]')
          if [ -z "$compact" ]; then
            echo "::error::the whatsnew block is empty — write a note or put NONE in it"
            exit 1
          fi

          if [ "$(printf '%s' "$compact" | tr '[:lower:]' '[:upper:]')" = "NONE" ]; then
            echo "declared not user-facing"
            exit 0
          fi

          echo "whatsnew note:"
          printf '%s\n' "$block"

      # Behavioural tests establish the contract. A short recording or
      # screenshot makes a human-visible change reviewable too, especially for
      # terminal timing, progress, and layout that assertions cannot convey.
      - name: require UX proof for human-visible changes
        if: github.actor != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          body=$(printf '%s' "$BODY" | tr -d '\r')

          if ! printf '%s\n' "$body" | grep -q '^```ux-proof[[:space:]]*$'; then
            echo "Add a ux-proof block to the PR description:"
            echo ''
            echo '    ```ux-proof'
            echo '    Reproduce: wsp fetch'
            echo '    https://asciinema.org/a/...'
            echo '    ```'
            echo ''
            echo "Use NONE when no human-visible behavior changed."
            echo "::error::PR description has no \`\`\`ux-proof block"
            exit 1
          fi

          block=$(printf '%s\n' "$body" | awk '
            /^```ux-proof[[:space:]]*$/ { inblock = 1; next }
            inblock && /^```/            { exit }
            inblock                      { print }
          ')
          compact=$(printf '%s' "$block" | tr -d '[:space:]')
          if [ -z "$compact" ]; then
            echo "::error::the ux-proof block is empty — add evidence or put NONE in it"
            exit 1
          fi
          if [ "$(printf '%s' "$compact" | tr '[:lower:]' '[:upper:]')" = "NONE" ]; then
            echo "declared no human-visible change"
            exit 0
          fi
          if ! printf '%s\n' "$block" | grep -q '^Reproduce:'; then
            echo "::error::UX proof needs a Reproduce: line with the command and fixture"
            exit 1
          fi
          if ! printf '%s\n' "$block" | grep -Eq 'https?://'; then
            echo "::error::UX proof needs an inspectable URL (prefer an asciinema recording)"
            exit 1
          fi
          echo "UX proof:"
          printf '%s\n' "$block"

  # Linux runs first. If logic is broken it shows up here cheaply before we
  # spin up macOS and Windows runners.
  #
  # Tests run in parallel; nothing may reintroduce shared process state.
  # set_var is unsafe in edition 2024 and both crate roots deny unsafe_code, so
  # no unit test can mutate the environment. That guard does not reach
  # crates/wsp/tests/*.rs (separate crates, no deny), safe calls like
  # set_current_dir, or reads of $HOME via Paths::resolve() — check those first
  # if --test-threads=1 ever looks necessary again.
  test-linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The shell_cd tests exercise the generated wrapper in each dialect. A
      # missing shell would skip that dialect silently, so install them and set
      # WSP_SHELL_TESTS_REQUIRE_ALL to turn a skip into a failure.
      - name: install shells for wrapper tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish
      - run: cargo build --release
      - run: cargo test
        env:
          WSP_SHELL_TESTS_REQUIRE_ALL: "1"

      # A step in this job rather than its own, so it reuses the --release
      # binary already built above and cannot silently never run. --offline
      # keeps PRs off the network; the network half stays release-only.
      # See scripts/README.md for the full rationale.
      - name: smoke (offline)
        run: ./scripts/smoke.sh --wsp ./target/release/wsp --offline

  # Cross-platform jobs run in parallel only after Linux passes. fail-fast:false
  # keeps both running so a single CI pass reveals all platform issues at once.
  test-cross:
    needs: test-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: enable windows longpaths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # macOS ships bash and zsh; fish is not preinstalled. Windows uses pwsh,
      # which is always present, so it needs no install step.
      - name: install fish for wrapper tests
        if: runner.os == 'macOS'
        # `brew install` exits non-zero when the formula is already present, so
        # check first — a preinstalled fish in a future runner image would
        # otherwise fail the job.
        run: brew list fish >/dev/null 2>&1 || brew install fish
      - run: cargo build --release
      - run: cargo test
        env:
          WSP_SHELL_TESTS_REQUIRE_ALL: "1"

      # See test-linux for why smoke runs here rather than in its own job. This
      # is the only place smoke.ps1 is ever executed before a release, which is
      # the main thing the PR run buys.
      - name: smoke (offline)
        if: runner.os != 'Windows'
        run: ./scripts/smoke.sh --wsp ./target/release/wsp --offline

      - name: smoke (offline)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 -Wsp .\target\release\wsp.exe -Offline
