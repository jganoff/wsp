# Read by every cargo-audit run: the audit job in ci.yml, the scheduled
# audit.yml, and `just audit`. One list here keeps the three from disagreeing.
#
# An entry belongs here only with a reason and a condition for removing it.

[advisories]
ignore = [
    # unsafe-libyaml is unmaintained (archived upstream, last release March
    # 2024). This is an informational advisory, not a vulnerability: nothing is
    # known to be exploitable. It arrives through serde_yaml_ng, which parses
    # .wsp.yaml, config.yaml and templates, and serde_yaml_ng has no release
    # that drops it. Remove this entry when the YAML crate is replaced with a
    # safe-Rust parser.
    "RUSTSEC-2024-0449",
]
