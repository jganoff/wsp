[workspace]
members = ["cargo:crates/wsp"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Release by dispatching the workflow, not by pushing a tag, so nobody needs
# push access to tags from a laptop. CI creates the tag itself via
# `gh release create --target <commit>`. Dispatching with the default input
# ("dry-run") plans without publishing.
dispatch-releases = true
# Smoke-test the built binaries before the release is tagged. This hook (not
# host-jobs) is the one that makes `host` wait: host-jobs produces a job with
# the same dependencies as host, so they race and the tag lands regardless.
global-artifacts-jobs = ["./smoke"]
# NOTE: release-notes is deliberately NOT a dist job hook. See
# .github/workflows/release-notes.yml for why none of them work.
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Homebrew tap repository
tap = "jganoff/homebrew-tap"
# Homebrew formula name
formula = "wsp"

# Pin the actions dist emits into release.yml, matching how every hand-written
# workflow here is pinned: a moved tag cannot then swap in different code.
#
# Without this dist emits floating tags (checkout@v6, upload-artifact@v7,
# download-artifact@v8), which is both a supply-chain gap and the reason
# Dependabot keeps opening PRs against release.yml that can never merge — a
# floating tag dist will not advance is permanently out of date, so the hunk
# rides along with every grouped update and fails `dist plan` each time.
#
# dist writes bare SHAs with no trailing version comment, so this table is the
# only human-readable record of which version each SHA is. Keep the comments
# accurate, and re-run `dist generate` after editing.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"          # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"   # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8

