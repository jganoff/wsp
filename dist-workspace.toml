[workspace]
members = ["cargo:crates/wsp"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Release by dispatching the workflow, not by pushing a tag, so nobody needs
# push access to tags from a laptop. CI creates the tag itself via
# `gh release create --target <commit>`. Dispatching with the default input
# ("dry-run") plans without publishing.
dispatch-releases = true
# Smoke-test the built binaries before the release is tagged. This hook (not
# host-jobs) is the one that makes `host` wait: host-jobs produces a job with
# the same dependencies as host, so they race and the tag lands regardless.
global-artifacts-jobs = ["./smoke"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Homebrew tap repository
tap = "jganoff/homebrew-tap"
# Homebrew formula name
formula = "wsp"
